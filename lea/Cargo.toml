[package]
name = "lea"
version = "0.1.0-rc.0"
description = "Pure Rust implementation of the LEA block cipher"
authors = ["RustCrypto Developers"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
documentation = "https://docs.rs/lea"
repository = "https://github.com/RustCrypto/block-ciphers"
keywords = ["crypto", "lea", "block-cipher"]
categories = ["cryptography", "no-std"]

[dependencies]
cipher = "0.5"

[dev-dependencies]
cipher = { version = "0.5", features = ["dev"] }
hex-literal = "1"

[features]
zeroize = ["cipher/zeroize"]

[package.metadata.docs.rs]
all-features = true
